[package]
name = "baker-dx"
version = "1.4.0"
authors = ["Wanye_7300 <chensiyuan-2009@outlook.com>"]
edition = "2024"

[workspace]
members = ["server", "protocol"]
resolver = "3"

[workspace.dependencies]
protocol = { path = "protocol" }

[dependencies]
chrono = { version = "0.4.43", features = ["serde", "wasmbind"] }
dioxus = { version = "0.7.9", features = ["router"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-storage = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
tokio = { version = "1.49.0", features = ["time"] }
uuid = { version = "1.8.0", features = ["v4", "js", "serde"] }
reqwest = "0.13.2"
rust-i18n = "4.0.0"
webbrowser = "1.1.0"
image = { version = "0.25.5", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "avif",
] }
semver = { version = "1.0.27", features = ["serde"] }
anyhow = "1.0.102"
sha2 = "0.10.9"
protocol.workspace = true

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[package.metadata.i18n]
available-locales = ["zh-CN", "en-US"]
default-locale = "zh-CN"
load-path = "locales"
